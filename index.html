function streak(){var t=new Date(),s=0;for(var n=0;n<400;n++){var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-n),p=prog(d);if(p===null)continue;if(p>=1)s++;else if(n>0)break}return s}
