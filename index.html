var FB={apiKey:"AIzaSyAIFE3kvwCElu0ZOzF6zvqVxUvwnRztp1k",authDomain:"pulso-entrenamiento.firebaseapp.com",projectId:"pulso-entrenamiento",appId:"1:370742068331:web:5c5a40e5c9d0666b1a9d2e"};
var EM=["🦊","🐼","🐯","🦁","🐸","🐙","🦄","🐵"],DB=null,cur="",LST=[],edit=0,tmr=0;
var fresh=()=>({plan:JSON.parse(JSON.stringify(DEFP)),log:{},rest:60,kmGoal:15,theme:"",ts:0,shoes:[],lastShoe:"",stepGoal:8000});
var L=k=>{try{return localStorage.getItem(k)}catch(e){return null}},Ls=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},cl=t=>{$("cl").textContent=t};
function sv(){S.ts=Date.now();if(!cur)return;Ls("pulso_"+cur,JSON.stringify(S));if(!DB){cl("💾 local");return}cl("☁ …");clearTimeout(tmr);tmr=setTimeout(()=>DB.collection("profiles").doc(cur).set({d:JSON.stringify(S),ts:S.ts}).then(()=>cl("☁ guardado")).catch(()=>cl("☁ sin conexión")),700)}

ps()}

$("ps").hidden=false}

cur=p.id;var loc=null;try{loc=JSON.parse(L("pulso_"+cur)||"null")}catch(e){}
S=mig(loc&&loc.plan&&loc.plan.length==7?Object.assign(fresh(),loc):fresh());$("ps").hidden=true;enter();cl(DB?"☁ …":"💾 local");if(DB)await pull()}
async function pull(){if(!DB||!cur)return;var id=cur;try{var d=await DB.collection("profiles").doc(id).get();if(id!=cur)return;
if(d.exists){var r=JSON.parse(d.data().d);if((r.ts||0)>(S.ts||0)){S=mig(Object.assign(fresh(),r));Ls("pulso_"+cur,JSON.stringify(S));refresh()}else if((S.ts||0)>(r.ts||0))sv()}else sv();cl("☁ al día")}catch(e){cl("☁ sin conexión")}}

pf(LST.length-1)}
